<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" role="img" aria-label="BrightMart hand-drawn blue shopping basket">
  <defs>
    <!-- slight wobble makes every line look hand drawn -->
    <filter id="hand" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#hand)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- yellow lines around the basket -->
    <g stroke="#FFC93C" stroke-width="7">
      <path d="M100 6 L100 22"/>
      <path d="M58 14 L68 28"/>
      <path d="M142 14 L132 28"/>
      <path d="M22 42 L38 50"/>
      <path d="M178 42 L162 50"/>
      <path d="M9 84 L24 86"/>
      <path d="M191 84 L176 86"/>
      <path d="M38 160 Q100 172 162 160"/>
    </g>
    <!-- handle -->
    <path d="M56 80 C52 22 148 22 144 80" stroke="#1B4F9C" stroke-width="10"/>
    <path d="M60 78 C58 30 142 30 140 78" stroke="#2F7DE1" stroke-width="4"/>
    <!-- basket body -->
    <path d="M30 80 L170 80 L153 142 Q151 150 143 150 L57 150 Q49 150 47 142 Z" fill="#2F7DE1" stroke="#1B4F9C" stroke-width="6"/>
    <!-- rim -->
    <path d="M24 78 L176 78" stroke="#1B4F9C" stroke-width="14"/>
    <!-- weave -->
    <g stroke="#A9CCF8" stroke-width="5">
      <path d="M72 94 L68 140"/>
      <path d="M100 94 L100 142"/>
      <path d="M128 94 L132 140"/>
      <path d="M40 108 L160 108"/>
      <path d="M45 128 L155 128"/>
    </g>
  </g>
</svg>
